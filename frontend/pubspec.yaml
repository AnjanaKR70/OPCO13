name: scamundo
description: An Android security app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <5.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.0.5
  url_launcher: ^6.3.0
  google_fonts: ^8.0.0
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.3
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^22.2.0
  android_intent_plus: ^6.1.0
  flutter_overlay_window: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
